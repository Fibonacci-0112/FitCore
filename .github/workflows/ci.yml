name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # github.com file pages answer CI with 503s under load, so check them on raw.githubusercontent.com instead.
          args: >-
            --no-progress --max-retries 5 --retry-wait-time 5 --include-fragments
            --remap 'https://github\.com/([^/]+)/([^/]+)/blob/(.+) https://raw.githubusercontent.com/$1/$2/$3'
            '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      # FitCore.Maui builds for Android here, with the runner's Android SDK and JDK. iOS and macOS need a Mac, Windows needs Windows.
      - run: dotnet workload install maui-android
      - run: dotnet restore FitCore.slnx
      # The Android platform the workload targets, if the runner image doesn't have it yet.
      - run: >-
          dotnet build src/FitCore.Maui --no-restore -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
      - run: dotnet format FitCore.slnx --no-restore --verify-no-changes
      - run: dotnet build FitCore.slnx --no-restore --configuration Release
      # FitCore.Platform.Tests, FitCore.Client.Tests and the module test projects run against the local stack, with
      # migrations and seed applied: Postgres, plus Auth, its gateway and the mail catcher for the sign-up tests. The rest
      # isn't needed.
      - run: supabase start -x realtime,storage-api,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # The local stack's secret key, for fitcore-app's Auth calls in the integration tests. Never committed (NFR-SEC-5).
      - run: echo "Supabase__SecretKey=$(supabase status -o env | sed -n 's/^SECRET_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
      - run: dotnet test --solution FitCore.slnx --no-build --configuration Release
      - name: Domain coverage gate (NFR-MNT-1)
        run: |
          dotnet test --project tests/FitCore.Domain.Tests --no-build --configuration Release \
            --coverage --coverage-output-format cobertura --coverage-output domain.cobertura.xml --results-directory TestResults
          python3 tests/coverage-gate.py TestResults/domain.cobertura.xml FitCore.Domain 90

  pgtap:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      # Postgres only, with every migration and the seed applied (NFR-MNT-2, NFR-PRV-1).
      - run: supabase db start
      - run: supabase test db

  spikes:
    name: Build spikes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build spikes/rls-pooling/RlsSpike
      - run: dotnet build spikes/auth-mfa/AuthSpike
      - run: dotnet build spikes/blazor-web-vitals/BlazorSpike
