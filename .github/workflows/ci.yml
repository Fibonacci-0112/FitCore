name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # github.com file pages answer CI with 503s under load, so check them on raw.githubusercontent.com instead.
          args: >-
            --no-progress --max-retries 5 --retry-wait-time 5 --include-fragments
            --remap 'https://github\.com/([^/]+)/([^/]+)/blob/(.+) https://raw.githubusercontent.com/$1/$2/$3'
            '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      # FitCore.Maui builds for Android here, with the runner's Android SDK and JDK. iOS and macOS need a Mac, Windows needs Windows.
      - run: dotnet workload install maui-android
      - run: dotnet restore FitCore.slnx
      # The Android platform the workload targets, if the runner image doesn't have it yet.
      - run: >-
          dotnet build src/FitCore.Maui --no-restore -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
      - run: dotnet format FitCore.slnx --no-restore --verify-no-changes
      # Release builds of FitCore.Maui need a Supabase project. CI only builds the app, so the local stack stands in;
      # a Release app refuses to start without an HTTPS address (NFR-SEC-6).
      - run: >-
          dotnet build FitCore.slnx --no-restore --configuration Release
          -p:SupabaseUrl=http://127.0.0.1:54321 -p:SupabasePublishableKey=sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      # FitCore.Platform.Tests, FitCore.Client.Tests and the module test projects run against the local stack, with
      # migrations and seed applied: Postgres, plus Auth, its gateway and the mail catcher for the sign-up tests. The rest
      # isn't needed.
      - run: supabase start -x realtime,storage-api,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # The local stack's secret key, for fitcore-app's Auth calls in the integration tests. Never committed (NFR-SEC-5).
      - run: echo "Supabase__SecretKey=$(supabase status -o env | sed -n 's/^SECRET_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
      - run: dotnet test --solution FitCore.slnx --no-build --configuration Release
      - name: Domain coverage gate (NFR-MNT-1)
        run: |
          dotnet test --project tests/FitCore.Domain.Tests --no-build --configuration Release \
            --coverage --coverage-output-format cobertura --coverage-output domain.cobertura.xml --results-directory TestResults
          python3 tests/coverage-gate.py TestResults/domain.cobertura.xml FitCore.Domain 90

  android:
    name: Android app on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      # The emulator needs hardware acceleration, which the runner allows once /dev/kvm is open to it.
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: dotnet workload install maui-android
      - run: dotnet restore FitCore.slnx
      - run: >-
          dotnet build src/FitCore.Maui --no-restore -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
      # A Debug build, which reaches the local stack at the emulator's host address (10.0.2.2), for the emulator's x86_64,
      # with its assemblies in the APK so it runs without Visual Studio's fast deployment.
      - run: >-
          dotnet build src/FitCore.Maui -f net10.0-android -p:RuntimeIdentifier=android-x64
          -p:EmbedAssembliesIntoApk=true -o artifacts/apk
      - run: dotnet build tests/FitCore.Maui.UITests --no-restore
      # Auth, its gateway and the mail catcher, with migrations and seed applied, as in "Build and test".
      - run: supabase start -x realtime,storage-api,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: |
          npm install --global appium@3.8.0
          appium driver install uiautomator2@8.7.0
      # Sign up, sign in, a restart and sign out through the app's screens (PR 4 acceptance).
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          FITCORE_ANDROID_APK: artifacts/apk/app.fitcore-Signed.apk
          FITCORE_UITEST_ARTIFACTS: ${{ github.workspace }}/TestResults/android
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: tests/FitCore.Maui.UITests/run-on-emulator.sh --no-build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test
          path: TestResults/android
          if-no-files-found: ignore

  pgtap:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      # Postgres only, with every migration and the seed applied (NFR-MNT-2, NFR-PRV-1).
      - run: supabase db start
      - run: supabase test db

  spikes:
    name: Build spikes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build spikes/rls-pooling/RlsSpike
      - run: dotnet build spikes/auth-mfa/AuthSpike
      - run: dotnet build spikes/blazor-web-vitals/BlazorSpike
